# GitHub Pages (Jekyll) do site do DISC: o que NÃO vira página pública em disc.gestaosemcaos.com.br.
# O repositório é público, mas o site só precisa dos HTML da raiz, assets/, js/ e vagas/. As pastas abaixo são
# código, documentação e testes. A pasta vagas/ fica publicada aqui como versão beta fechada com código
# (disc.gestaosemcaos.com.br/vagas/) até o domínio próprio (vagas.gestaosemcaos.com.br, Cloudflare Pages) abrir;
# vagas/functions/ é código do Cloudflare e não vira página.
exclude:
  - vagas/functions
  - supabase
  - tests
  - test-results
  - scripts
  - docs
  - conteudo
  - apps-script
  - dist
  - node_modules
  - package.json
  - package-lock.json
  - playwright.config.js
  - README.md
  - CLAUDE.md
