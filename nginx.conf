# nginx do site do DISC. Sem CSP aqui: cada página (ex.: admin.html) já traz o seu. TLS e domínio ficam no proxy da VPS.
server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # nada de arquivo escondido (.git, .env, ...)
  location ~ /\. { return 404; }

  # Como no GitHub Pages: /pagina abre pagina.html; HTML sempre revalidado, o resto por 10 minutos.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|ico|woff2?|json)$ {
    add_header Cache-Control "public, max-age=600" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }
}
