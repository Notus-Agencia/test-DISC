# Stack do DISC na VPS (Docker Swarm). Modelo: copiar para /opt/stacks/disc.yaml no servidor e ajustar os marcadores <...>.
# Sem segredo aqui: os segredos são criados no servidor (docker secret create) e só citados pelo nome.
# Passo a passo: docs/VPS-PUBLICACAO.md.
version: "3.8"

services:
  site:
    image: disc-site:<TAG>            # ex.: disc-site:2026-11-12-ab12cd3 (data + commit; permite voltar atrás)
    deploy:
      replicas: 1
      update_config: { order: start-first, failure_action: rollback }
      resources:
        limits: { memory: 128M }
      labels:
        # Traefik v3 da VPS (mesmo molde dos outros sites estáticos): certificado Let's Encrypt (resolvedor "le"),
        # emitido depois que o DNS de disc.gestaosemcaos.com.br apontar para a VPS.
        - "traefik.enable=true"
        - "traefik.docker.network=notus-net"
        - "traefik.http.routers.disc.rule=Host(`disc.gestaosemcaos.com.br`)"
        - "traefik.http.routers.disc.entrypoints=websecure"
        - "traefik.http.routers.disc.tls.certresolver=le"
        - "traefik.http.services.disc.loadbalancer.server.port=80"
    networks: [notus-net]

  rotinas:
    image: disc-rotinas:<TAG>
    environment:
      SUPABASE_URL: <https://REF.supabase.co>     # endereço público, não é segredo
      RCLONE_DESTINO: "<remoto:pasta>"            # 2ª cópia fora do servidor; apagar a linha se não usar
    secrets: [supabase_db_url, backup_senha, supabase_anon_key, rclone_conf]
    volumes: [disc_backups:/backups]
    deploy:
      replicas: 1
      resources:
        limits: { memory: 256M }

secrets:
  supabase_db_url: { external: true }
  backup_senha:    { external: true }
  supabase_anon_key: { external: true }
  rclone_conf:     { external: true }

volumes:
  disc_backups:

networks:
  notus-net: { external: true }
