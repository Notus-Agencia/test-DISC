# Configuração do Supabase para a integração GitHub ("Deploy to production").
# Em produção a integração aplica só: migrações (supabase/migrations) e Edge Functions declaradas aqui.
# Configurações de Auth/API deste arquivo NÃO são aplicadas em produção (ficam no painel do Supabase).
project_id = "tevpqngqzxcswmticjnr"

# As funções conferem o acesso por conta própria:
#  - admin: valida o JWT do usuário e se ele é administrador (tabela admins);
#  - disc-sync: chamada pelo site do candidato com a chave pública (sb_publishable, que não é JWT); só responde {ok};
#  - clickup-webhook: chamada pelo ClickUp, valida a assinatura HMAC (CLICKUP_WEBHOOK_SECRET).
[functions.admin]
verify_jwt = false

[functions.disc-sync]
verify_jwt = false

[functions.clickup-webhook]
verify_jwt = false

# Venda direta (Mapa de Perfil):
#  - pagamento: chamada pelo site do cliente com a chave pública; confere pedidoId + tokenAcesso do pedido;
#  - asaas-webhook: chamada pelo Asaas, valida o cabeçalho asaas-access-token (segredo ASAAS_WEBHOOK_TOKEN);
#  - infinitepay-webhook: chamada pela InfinitePay (sem assinatura); só libera depois de conferir no payment_check;
#  - stripe-webhook: chamada pelo Stripe, valida a assinatura Stripe-Signature (STRIPE_WEBHOOK_SECRET).
[functions.pagamento]
verify_jwt = false

[functions.asaas-webhook]
verify_jwt = false

[functions.infinitepay-webhook]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# Pesquisa de Clima (link pessoal): clima manda o código de confirmação; o banco confere o token e aplica os limites.
[functions.clima]
verify_jwt = false
